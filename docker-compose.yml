services:
  web:
    container_name: fastapi_app
    build: .
    ports:
      - "17000:8000"
    volumes:
      - .:/code
    environment:
      # Impede que o Python crie arquivos de cache, ideal no Docker 
      - PYTHONDONTWRITEBYTECODE=1
      # Força o Python a enviar os logs diretamente para o terminal
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://post_user:post_pass@db:5432/fastapi_db
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_pass
      POSTGRES_DB: fastapi_db
    ports:
      - "17002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_db
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "17001:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # <-- ADICIONE ESTA LINHA AQUI
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
